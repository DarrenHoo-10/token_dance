<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TokenDance User Product UI</title>
  <style>
    :root {
      --ink: #111512;
      --muted: #687069;
      --line: #e4e9e4;
      --surface: #ffffff;
      --soft: #f5f7f4;
      --lime: #b9f600;
      --lime-soft: #efffd0;
      --good: #4fb600;
      --warning: #f2a600;
      --danger: #e9573f;
      --radius: 18px;
      --shadow: 0 18px 60px rgba(36, 58, 41, .09);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; overflow: hidden; background: #f4f7f3; color: var(--ink); font-family: Arial, "Microsoft YaHei", sans-serif; }
    body { min-width: 1180px; }
    button, input, select { font: inherit; }
    button { cursor: default; }
    .screen { width: 1440px; height: 960px; margin: 0 auto; position: relative; overflow: hidden; background: linear-gradient(135deg, #fbfcfb 0%, #f6faf3 100%); }
    .mock-label { position: absolute; right: 22px; bottom: 16px; color: #aab2aa; font: 11px/1 monospace; letter-spacing: .08em; z-index: 20; }
    .nav { position: relative; z-index: 10; height: 76px; margin: 22px 44px 0; padding: 0 20px; display: flex; align-items: center; gap: 30px; border: 1px solid rgba(218,225,218,.95); border-radius: 22px; background: rgba(255,255,255,.94); box-shadow: 0 10px 35px rgba(37,60,41,.07); }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 190px; font-size: 21px; font-weight: 800; letter-spacing: -.04em; }
    .brand img { width: 34px; height: 34px; object-fit: contain; }
    .nav-links { display: flex; align-items: center; gap: 28px; font-size: 14px; color: #3d443e; }
    .nav-links span.active { color: var(--ink); font-weight: 750; position: relative; }
    .nav-links span.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -24px; height: 2px; background: var(--lime); }
    .nav-search { margin-left: auto; width: 310px; height: 42px; padding: 0 15px; display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; color: #9aa19a; font-size: 13px; background: #fbfcfb; }
    .locale-switch { height: 34px; padding: 3px; display: inline-flex; gap: 2px; border: 1px solid var(--line); border-radius: 10px; background: #f4f7f3; }
    .locale-switch button { min-width: 38px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; color: #747c75; font-size: 10px; font-weight: 750; }
    .locale-switch button.active { background: #111512; color: white; }
    .avatar { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: #121513; color: white; font-weight: 750; font-size: 12px; }
    .button { height: 42px; padding: 0 17px; border-radius: 11px; border: 1px solid var(--line); background: white; color: var(--ink); font-weight: 700; }
    .button.primary { border-color: var(--lime); background: var(--lime); }
    .button.dark { border-color: #121513; background: #121513; color: white; }
    .button.ghost { background: transparent; }
    .eyebrow { margin: 0 0 8px; color: #6d756e; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 10px; font-size: 38px; letter-spacing: -.045em; line-height: 1.05; }
    h2 { margin-bottom: 6px; font-size: 19px; letter-spacing: -.02em; }
    h3 { margin-bottom: 4px; font-size: 14px; }
    .subtle { color: var(--muted); }
    .tag { display: inline-flex; align-items: center; min-height: 26px; padding: 0 9px; border-radius: 8px; background: #eff2ef; color: #4e554f; font-size: 11px; font-weight: 700; }
    .tag.lime { background: var(--lime-soft); color: #477800; }
    .status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 4px rgba(79,182,0,.1); }
    .panel { border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255,255,255,.96); box-shadow: 0 12px 38px rgba(41,63,45,.055); }

    /* Auth */
    .auth-screen { display: grid; grid-template-columns: 1.05fr .95fr; }
    .auth-brand { min-height: 960px; padding: 54px 64px; position: relative; overflow: hidden; background: #111512; color: white; }
    .auth-brand::before { content: ""; position: absolute; width: 640px; height: 640px; right: -160px; top: 110px; border-radius: 50%; background: radial-gradient(circle, rgba(185,246,0,.24), rgba(185,246,0,0) 68%); }
    .auth-brand .brand { position: relative; z-index: 2; }
    .auth-brand .brand img { width: 42px; height: 42px; }
    .auth-copy { position: relative; z-index: 2; margin-top: 150px; max-width: 530px; }
    .auth-copy h1 { font-size: 70px; line-height: .98; letter-spacing: -.065em; }
    .auth-copy h1 span { color: var(--lime); }
    .auth-copy p { margin-top: 28px; max-width: 420px; color: #c7cec8; font-size: 18px; line-height: 1.7; }
    .auth-preview { position: absolute; z-index: 2; left: 64px; right: 64px; bottom: 66px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .auth-preview div { padding: 17px; border: 1px solid rgba(255,255,255,.14); border-radius: 14px; background: rgba(255,255,255,.06); }
    .auth-preview small { display: block; margin-bottom: 8px; color: #a9b1aa; }
    .auth-preview strong { font-size: 24px; }
    .auth-form-wrap { display: grid; place-items: center; padding: 60px; background: #fbfcfb; }
    .auth-form { width: 440px; padding: 42px; }
    .auth-form .mini-logo { width: 54px; height: 54px; object-fit: contain; margin-bottom: 32px; }
    .auth-form h2 { font-size: 32px; letter-spacing: -.04em; }
    .auth-form > p { margin-bottom: 30px; color: var(--muted); line-height: 1.65; }
    .auth-form-wrap { position: relative; }
    .auth-locale { position: absolute; top: 36px; right: 42px; }
    .auth-tabs { display: flex; gap: 20px; margin: 26px 0 22px; border-bottom: 1px solid var(--line); }
    .auth-tabs span { padding: 0 2px 10px; color: var(--muted); font-size: 13px; }
    .auth-tabs span.active { border-bottom: 2px solid #111512; color: #111512; font-weight: 750; }
    .auth-login-field { display: grid; gap: 7px; margin-bottom: 15px; }
    .auth-login-field label { font-size: 11px; font-weight: 750; }
    .auth-login-input { height: 48px; padding: 0 14px; display: flex; align-items: center; border: 1px solid #dfe5df; border-radius: 11px; background: #fbfcfb; color: #343a35; font-size: 13px; }
    .auth-link-row { margin: -2px 0 17px; display: flex; justify-content: space-between; color: #657066; font-size: 11px; }
    .auth-submit { width: 100%; height: 50px; border: 0; border-radius: 12px; background: #111512; color: white; font-weight: 750; font-size: 14px; }
    .auth-register { margin-top: 16px; text-align: center; color: var(--muted); font-size: 11px; }
    .auth-register b { color: #273027; }
    .auth-trust { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--line); color: #7b837c; font-size: 12px; line-height: 1.7; }
    .auth-trust strong { color: #3d443e; }
    .terms { margin-top: 20px; color: #9aa19a; font-size: 11px; line-height: 1.6; }

    /* Onboarding */
    .onboarding-bg { padding-top: 120px; background: radial-gradient(circle at 50% 0, rgba(185,246,0,.16), transparent 36%), #f5f8f4; }
    .onboarding-header { position: absolute; top: 32px; left: 52px; right: 52px; display: flex; align-items: center; justify-content: space-between; }
    .onboarding-header .brand { min-width: auto; }
    .onboarding-meta { display: flex; align-items: center; gap: 14px; }
    .step-label { color: #6d756e; font-size: 12px; font-weight: 700; }
    .onboarding-card { width: 1040px; min-height: 740px; margin: 0 auto; display: grid; grid-template-columns: 330px 1fr; overflow: hidden; }
    .onboarding-rail { padding: 38px 34px; background: #111512; color: white; }
    .onboarding-rail h2 { margin-top: 10px; font-size: 27px; }
    .onboarding-rail > p { color: #aeb6af; line-height: 1.55; }
    .steps { margin-top: 42px; display: grid; gap: 22px; }
    .step { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; color: #98a099; }
    .step b { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; border: 1px solid #3c453e; color: #b6bdb7; }
    .step.active { color: white; }
    .step.active b { border-color: var(--lime); background: var(--lime); color: #111512; }
    .step small { display: block; margin-top: 3px; color: #7f8881; line-height: 1.4; }
    .onboarding-main { padding: 44px 50px; }
    .onboarding-main h1 { font-size: 34px; }
    .form-grid { margin-top: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .field { display: grid; gap: 8px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 12px; font-weight: 750; }
    .input { height: 46px; padding: 0 14px; border: 1px solid #dfe5df; border-radius: 11px; background: #fbfcfb; color: #202421; }
    .handle-input { display: flex; align-items: center; height: 46px; padding-left: 14px; border: 1px solid #dfe5df; border-radius: 11px; background: #fbfcfb; color: #929a93; }
    .handle-input span:last-child { color: #202421; }
    .avatar-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
    .avatar-row .avatar { width: 54px; height: 54px; font-size: 16px; }
    .privacy-choice { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .choice { padding: 18px; border: 1px solid var(--line); border-radius: 13px; background: #fff; }
    .choice.selected { border-color: #87bd00; box-shadow: inset 0 0 0 1px #87bd00; background: #fbfff0; }
    .choice p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .consent { grid-column: 1 / -1; padding: 14px 16px; border-radius: 12px; background: var(--soft); color: #5b635c; font-size: 12px; line-height: 1.55; }
    .form-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }

    /* Product shell */
    .page { padding: 30px 58px 54px; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 22px; }
    .page-head p { margin-bottom: 0; color: var(--muted); }
    .head-actions { display: flex; gap: 10px; }
    .segmented { height: 42px; padding: 4px; display: flex; gap: 3px; border: 1px solid var(--line); border-radius: 12px; background: white; }
    .segmented span { min-width: 66px; padding: 8px 12px; text-align: center; border-radius: 8px; color: var(--muted); font-size: 12px; }
    .segmented .active { background: #111512; color: white; }
    .metric-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
    .metric { grid-column: span 2; min-height: 82px; padding: 12px 14px; }
    .metric small { color: var(--muted); font-size: 9px; }
    .metric strong { display: block; margin: 6px 0 3px; font-size: 19px; letter-spacing: -.04em; white-space: nowrap; }
    .metric em { color: var(--good); font-style: normal; font-size: 9px; font-weight: 700; }
    .dashboard-grid { margin-top: 14px; display: grid; grid-template-columns: 1.55fr .85fr; gap: 14px; }
    .dashboard-grid .chart-panel, .dashboard-grid .agents { min-height: 240px; }
    .dashboard-grid .chart { height: 132px; }
    .chart-panel { min-height: 286px; padding: 22px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    .panel-head p { margin-bottom: 0; color: var(--muted); font-size: 12px; }
    .chart-filters { display: flex; align-items: center; gap: 7px; }
    .chart-filters select { height: 31px; padding: 0 24px 0 9px; border: 1px solid var(--line); border-radius: 8px; background: #f8faf7; color: #555d56; font-size: 10px; }
    .chart { position: relative; height: 176px; border-bottom: 1px solid var(--line); background: repeating-linear-gradient(to bottom, transparent 0, transparent 43px, #edf0ed 44px); }
    .chart svg { position: absolute; inset: 8px 0 6px; width: 100%; height: calc(100% - 14px); }
    .chart-axis { display: flex; justify-content: space-between; margin-top: 8px; color: #969d97; font-size: 10px; }
    .agents { min-height: 286px; padding: 22px; }
    .agent-row { display: grid; grid-template-columns: 1fr 48px; gap: 12px; margin-top: 15px; }
    .agent-row header { display: flex; justify-content: space-between; margin-bottom: 7px; font-size: 12px; }
    .bar { height: 8px; border-radius: 5px; background: #edf1ec; overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: inherit; background: var(--lime); }
    .agent-row small { align-self: end; color: var(--muted); text-align: right; }
    .dashboard-lower { margin-top: 14px; display: grid; grid-template-columns: 1.1fr .9fr .9fr; gap: 14px; }
    .heat, .skills, .sync { min-height: 188px; padding: 20px; }
    .heat-grid { display: grid; grid-template-columns: repeat(14, 1fr); gap: 5px; margin-top: 15px; }
    .heat-grid i { aspect-ratio: 1; border-radius: 4px; background: #edf1eb; }
    .heat-grid i:nth-child(4n) { background: #dff69a; }
    .heat-grid i:nth-child(7n) { background: #b9ed34; }
    .heat-grid i:nth-child(11n) { background: #78c900; }
    .dashboard-lower .heat-grid i { height: 19px; aspect-ratio: auto; }
    .skill-list { display: grid; gap: 9px; margin-top: 12px; }
    .skill-row { display: grid; grid-template-columns: 22px 1fr auto; gap: 9px; align-items: center; font-size: 11px; }
    .skill-row > b:first-child { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 7px; background: var(--lime-soft); color: #5f9400; font-size: 9px; }
    .skill-row small { color: var(--muted); font-size: 9px; }
    .sync-list { display: grid; gap: 12px; margin-top: 14px; }
    .sync-item { display: flex; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid #edf0ed; font-size: 12px; }
    .sync-item:last-child { border-bottom: 0; }
    .sync-item small { color: var(--muted); }

    /* Explore */
    .explore-search { height: 62px; display: flex; align-items: center; gap: 14px; padding: 0 20px; border: 2px solid #1b201c; border-radius: 16px; background: white; box-shadow: 0 12px 35px rgba(36,58,41,.08); }
    .explore-search b { font-size: 22px; }
    .explore-search span { flex: 1; color: #303631; font-size: 17px; }
    .explore-search kbd { padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: #f6f8f5; color: #7c847d; font-size: 10px; }
    .filter-row { margin-top: 13px; display: flex; align-items: center; gap: 9px; }
    .filter-chip { height: 34px; padding: 0 12px; display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 9px; background: white; color: #555d56; font-size: 12px; }
    .filter-chip.active { border-color: #111512; background: #111512; color: white; }
    .result-grid { margin-top: 18px; display: grid; grid-template-columns: 1.05fr .95fr; gap: 14px; }
    .result-panel { padding: 22px; min-height: 570px; }
    .result-count { color: var(--muted); font-size: 11px; }
    .person { display: grid; grid-template-columns: 46px 1fr auto; gap: 13px; align-items: center; padding: 15px 0; border-bottom: 1px solid #edf0ed; }
    .person .avatar { width: 44px; height: 44px; }
    .person p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .person-data { display: grid; grid-template-columns: 90px 70px; gap: 14px; text-align: right; }
    .person-data strong { display: block; font-size: 14px; }
    .person-data small { color: var(--muted); font-size: 9px; }
    .facet { padding: 16px 0; border-bottom: 1px solid #edf0ed; }
    .facet:last-child { border-bottom: 0; }
    .facet header { display: flex; justify-content: space-between; align-items: center; }
    .facet p { margin: 8px 0 12px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .facet-tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .compare-tray { position: absolute; left: 337px; right: 337px; bottom: 26px; height: 68px; padding: 0 14px 0 20px; display: flex; align-items: center; gap: 12px; border: 1px solid #ccd5cc; border-radius: 16px; background: #111512; color: white; box-shadow: 0 18px 55px rgba(18,26,20,.24); }
    .compare-tray > strong { margin-right: auto; }
    .compare-user { display: flex; align-items: center; gap: 7px; color: #dce2dd; font-size: 11px; }
    .compare-user i { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: #323934; font-style: normal; }

    /* Public profile */
    .profile-hero { padding: 25px; display: grid; grid-template-columns: 1fr auto; align-items: center; }
    .identity { display: flex; align-items: center; gap: 18px; }
    .identity .avatar { width: 82px; height: 82px; font-size: 22px; background: linear-gradient(135deg, #202521, #536056); }
    .identity h1 { margin-bottom: 4px; font-size: 32px; }
    .identity p { margin-bottom: 10px; color: var(--muted); }
    .hero-stats { display: flex; gap: 34px; padding-left: 34px; border-left: 1px solid var(--line); }
    .hero-stats div { min-width: 86px; }
    .hero-stats small { color: var(--muted); }
    .hero-stats strong { display: block; margin-top: 7px; font-size: 23px; }
    .profile-grid { margin-top: 14px; display: grid; grid-template-columns: 1.4fr .8fr; gap: 14px; }
    .profile-chart { padding: 22px; min-height: 315px; }
    .rank-card { padding: 22px; min-height: 315px; background: linear-gradient(145deg, #111512, #222a23); color: white; }
    .rank-number { margin-top: 24px; display: flex; align-items: end; gap: 10px; }
    .rank-number strong { font-size: 82px; letter-spacing: -.08em; line-height: .9; }
    .rank-number span { margin-bottom: 9px; color: var(--lime); }
    .rank-card p { margin-top: 18px; color: #aeb6af; font-size: 12px; line-height: 1.55; }
    .rank-scale { margin-top: 28px; height: 8px; border-radius: 5px; background: #303832; overflow: hidden; }
    .rank-scale i { display: block; width: 91%; height: 100%; background: var(--lime); }
    .profile-lower { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .profile-lower > section { min-height: 192px; padding: 20px; }
    .achievement { margin-top: 17px; display: flex; align-items: center; gap: 13px; }
    .achievement b { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: var(--lime-soft); color: #5e9300; }

    /* Settings */
    .settings-layout { display: grid; grid-template-columns: 235px 1fr; gap: 18px; }
    .settings-nav { padding: 18px; align-self: start; }
    .settings-nav strong { display: block; padding: 10px 11px; margin-bottom: 6px; font-size: 12px; }
    .settings-nav span { display: block; padding: 11px; border-radius: 9px; color: var(--muted); font-size: 12px; }
    .settings-nav span.active { background: #111512; color: white; }
    .settings-main { display: grid; gap: 14px; }
    .settings-card { padding: 22px; }
    .setting-row { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; padding: 16px 0; border-bottom: 1px solid #edf0ed; }
    .setting-row:last-child { border-bottom: 0; }
    .setting-row p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .switch { width: 42px; height: 24px; padding: 3px; border-radius: 13px; background: #dce2dc; }
    .switch::after { content: ""; display: block; width: 18px; height: 18px; border-radius: 50%; background: white; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
    .switch.on { background: #111512; }
    .switch.on::after { margin-left: 18px; background: var(--lime); }
    .device { display: grid; grid-template-columns: 44px 1fr auto; gap: 13px; align-items: center; padding: 16px 0; border-bottom: 1px solid #edf0ed; }
    .device:last-child { border-bottom: 0; }
    .device-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 11px; background: #f0f4ef; color: #4f584f; font-size: 11px; font-weight: 800; }
    .device p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .device-action { color: #6a726b; font-size: 11px; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const logo = '../../logo-tokendance-v2.png';
    const app = document.getElementById('app');
    const params = new URLSearchParams(location.search);
    const screen = params.get('screen') || 'dashboard';
    const localeControl = () => `<div class="locale-switch" aria-label="Language"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button></div>`;

    const nav = (active = 'TokenBoard') => `
      <header class="nav">
        <div class="brand"><img src="${logo}" alt=""><span>TokenDance</span></div>
        <div class="nav-links"><span class="${active === 'TokenBoard' ? 'active' : ''}">TokenBoard</span><span class="${active === 'Explore' ? 'active' : ''}">Explore</span><span>Community</span><span>Teams</span></div>
        <div class="nav-search">搜索用户、Agent、Skill...</div>
        ${localeControl()}
        <div class="avatar">HD</div>
      </header>`;

    const metric = (label, value, hint) => `<section class="metric panel"><small>${label}</small><strong>${value}</strong><em>${hint}</em></section>`;
    const mockLabel = `<div class="mock-label">TOKENDANCE PRODUCT MOCK · 2026</div>`;
    const heat = Array.from({ length: 70 }, () => '<i></i>').join('');

    const screens = {
      auth: `
        <section class="screen auth-screen">
          <div class="auth-brand">
            <div class="brand"><img src="${logo}" alt=""><span>TokenDance</span></div>
            <div class="auth-copy"><p class="eyebrow" style="color:#b9f600">AI developer community</p><h1>Let Token<br><span>Dance.</span></h1><p>连接你的 AI Coding Agent，把每一次创造沉淀成可见的成长轨迹。</p></div>

    const originalText = new WeakMap();
    function applyLanguage(language) {
      const walker = document.createTreeWalker(app, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach((node) => {
        if (!originalText.has(node)) originalText.set(node, node.nodeValue);
        const source = originalText.get(node);
        const trimmed = source.trim();
        const replacement = language === 'en' ? (translations[trimmed] || trimmed) : trimmed;
        node.nodeValue = source.replace(trimmed, replacement);
      });
      document.documentElement.lang = language === 'en' ? 'en' : 'zh-CN';
      document.querySelectorAll('[data-lang]').forEach((button) => button.classList.toggle('active', button.dataset.lang === language));
    }

    document.querySelectorAll('[data-lang]').forEach((button) => button.addEventListener('click', () => {
      const language = button.dataset.lang;
      params.set('lang', language);
      history.replaceState(null, '', `?${params.toString()}`);
      applyLanguage(language);
    }));
    applyLanguage(params.get('lang') === 'en' ? 'en' : 'zh');
  </script>
