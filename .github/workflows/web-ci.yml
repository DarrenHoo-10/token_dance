name: web-ci

on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/web-ci.yml
  pull_request:
    paths:
      - web/**
      - .github/workflows/web-ci.yml

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      # The build script runs the TypeScript check first, then the Vite build.
      - name: Typecheck and build
        run: npm run build
