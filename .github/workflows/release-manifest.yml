name: release-manifest

on:
  push:
    paths: [web/**, tools/releases/**, schemas/**, server/db/migrations/**, server/internal/migrate/**, deploy/nginx-token-dance.conf, .github/workflows/release-manifest.yml]
  pull_request:
    paths: [web/**, tools/releases/**, schemas/**, server/db/migrations/**, server/internal/migrate/**, deploy/nginx-token-dance.conf, .github/workflows/release-manifest.yml]

permissions:
  contents: read

jobs:
  contract-and-publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python3 tools/releases/test_publish_manifest.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: python3 -m pip install -r tools/releases/requirements.txt
      - run: python3 tools/releases/test_release_registry.py
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test -- src/test/download-docs.test.tsx src/test/navigation.test.tsx
