name: server-ci

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server-ci.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server-ci.yml']

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: tokendance_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=12
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Unit tests and vet
        run: |
          go test ./...
          go vet ./...
      - name: MySQL identity and revision regressions
        env:
          TOKENDANCE_TEST_MYSQL_DSN: root@tcp(127.0.0.1:3306)/tokendance_ci?parseTime=true&loc=UTC
        run: go test -race ./internal/worker -run 'TestUsageIdentityDedupAndRepair|TestUsageIdentityMixedBatchMySQL|TestTelemetryAggregationReplayNoDoubleAdd' -count=1 -v
