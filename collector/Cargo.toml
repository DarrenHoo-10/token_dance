[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/adapter-sdk",
    "crates/adapter-host",
    "crates/collector-core",
    "crates/privacy",
    "crates/wal-spool",
    "crates/uploader",
    "crates/acquisition",
    "crates/config-executor",
    "adapters/mock",
    "adapters/codex",
    "adapters/claude",
    "adapters/grok-build",
    "adapters/cursor",
    "adapters/zcode",
    "adapters/pi",
    "adapters/deepseek-harness",
    "apps/service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
adapter-sdk = { path = "crates/adapter-sdk" }
adapter-host = { path = "crates/adapter-host" }
collector-core = { path = "crates/collector-core" }
privacy = { path = "crates/privacy" }
wal-spool = { path = "crates/wal-spool" }
uploader = { path = "crates/uploader" }
acquisition = { path = "crates/acquisition" }
config-executor = { path = "crates/config-executor" }
adapter-mock = { path = "adapters/mock" }
adapter-codex = { path = "adapters/codex" }
adapter-claude = { path = "adapters/claude" }
adapter-grok-build = { path = "adapters/grok-build" }
adapter-cursor = { path = "adapters/cursor" }
adapter-zcode = { path = "adapters/zcode" }
adapter-pi = { path = "adapters/pi" }
adapter-deepseek-harness = { path = "adapters/deepseek-harness" }
collector-service = { path = "apps/service" }

aes-gcm = "0.10"
async-trait = "0.1"
base64 = "0.22"
ciborium = "0.2"
crc32c = "0.6"
ed25519-dalek = "2"
flate2 = "1"
futures = "0.3"
hmac = "0.12"
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
