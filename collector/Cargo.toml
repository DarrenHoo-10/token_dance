[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/adapter-sdk",
    "crates/adapter-host",
    "crates/collector-core",
    "crates/privacy",
    "adapters/mock",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
adapter-sdk = { path = "crates/adapter-sdk" }
adapter-host = { path = "crates/adapter-host" }
collector-core = { path = "crates/collector-core" }
privacy = { path = "crates/privacy" }
adapter-mock = { path = "adapters/mock" }

async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt"] }
