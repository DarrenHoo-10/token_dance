[package]
name = "adapter-codex"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
adapter-sdk = { path = "../../crates/adapter-sdk" }
async-trait = "0.1"
protocol = { path = "../../crates/protocol" }
serde_json = "1"

[dev-dependencies]
adapter-host = { path = "../../crates/adapter-host" }
privacy = { path = "../../crates/privacy" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
