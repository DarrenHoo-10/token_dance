[package]
name = "blob-decoder"
version = "0.2.2"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "TokenDance's V8-only fork of blob-decoder 0.2.2"

[workspace]

[lib]
name = "blob_decoder"
path = "src/lib.rs"

[features]
default = []

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
