[package]
name = "platform-credentials"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
login-keychain = []

[dev-dependencies]
tempfile.workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework = { version = "3.7", features = ["OSX_10_15"] }
security-framework-sys = { version = "2.17", features = ["OSX_10_15"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
keyring = { version = "3.6.3", default-features = false }
