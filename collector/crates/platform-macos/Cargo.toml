[package]
name = "platform-macos"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22"
getrandom = "0.2"
keyring = { version = "3", default-features = false, features = ["apple-native"] }
