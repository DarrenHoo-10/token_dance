[package]
name = "tokendance-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "TokenDance command-line collector and local dashboard"

[[bin]]
name = "tokendance"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
collector-service = { path = "../service" }
platform-credentials = { path = "../../crates/platform-credentials" }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
wal-spool = { path = "../../crates/wal-spool" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
