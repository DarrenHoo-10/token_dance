[package]
name = "collector-service"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "tokendance-collector"
path = "src/main.rs"

[dependencies]
acquisition = { path = "../../crates/acquisition" }
adapter-sdk = { path = "../../crates/adapter-sdk" }
async-trait = "0.1"
adapter-claude = { path = "../../adapters/claude" }
adapter-codex = { path = "../../adapters/codex" }
adapter-cursor = { path = "../../adapters/cursor" }
adapter-deepseek-harness = { path = "../../adapters/deepseek-harness" }
adapter-grok-build = { path = "../../adapters/grok-build" }
adapter-pi = { path = "../../adapters/pi" }
adapter-zcode = { path = "../../adapters/zcode" }
adapter-opencode = { path = "../../adapters/opencode" }
adapter-workbuddy = { path = "../../adapters/workbuddy" }
adapter-doubao-work = { path = "../../adapters/doubao-work" }
adapter-droid = { path = "../../adapters/droid" }
collector-core = { path = "../../crates/collector-core" }
config-executor = { path = "../../crates/config-executor" }
protocol = { path = "../../crates/protocol" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "fs"] }
# Shared v2 pipeline (moved from the desktop crate).
base64 = "0.22"
blob-decoder = { version = "0.2", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
forensicnomicon-core = "1.5"
leveldb-core = "0.1"
notify = "8"
rusqlite = { version = "0.32", features = ["bundled"] }
semver = "1"
sha2 = "0.10"
snap = "1"
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.13"
uploader = { path = "../../crates/uploader" }
wal-spool = { path = "../../crates/wal-spool" }

[dev-dependencies]
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "logs"] }
prost = "0.14"
protocol = { path = "../../crates/protocol" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
