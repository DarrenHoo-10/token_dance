[package]
name = "collector-service"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "tokendance-collector"
path = "src/main.rs"

[dependencies]
acquisition = { path = "../../crates/acquisition" }
adapter-sdk = { path = "../../crates/adapter-sdk" }
async-trait = "0.1"
adapter-claude = { path = "../../adapters/claude" }
adapter-codex = { path = "../../adapters/codex" }
adapter-cursor = { path = "../../adapters/cursor" }
adapter-deepseek-harness = { path = "../../adapters/deepseek-harness" }
adapter-grok-build = { path = "../../adapters/grok-build" }
adapter-zcode = { path = "../../adapters/zcode" }
collector-core = { path = "../../crates/collector-core" }
config-executor = { path = "../../crates/config-executor" }
protocol = { path = "../../crates/protocol" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
uploader = { path = "../../crates/uploader" }
wal-spool = { path = "../../crates/wal-spool" }

[dev-dependencies]
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "logs"] }
prost = "0.14"
protocol = { path = "../../crates/protocol" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
