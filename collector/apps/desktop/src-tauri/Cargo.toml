[workspace]

[package]
name = "tokendance-desktop"
version = "0.1.14"
edition = "2021"
authors = ["TokenDance Team"]
description = "TokenDance Desktop Collector Settings Shell"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
acquisition = { path = "../../../crates/acquisition" }
adapter-sdk = { path = "../../../crates/adapter-sdk" }
collector-core = { path = "../../../crates/collector-core" }
collector-service = { path = "../../service" }
config-executor = { path = "../../../crates/config-executor" }
protocol = { path = "../../../crates/protocol" }
wal-spool = { path = "../../../crates/wal-spool" }
uploader = { path = "../../../crates/uploader" }
privacy = { path = "../../../crates/privacy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full", "sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
ulid = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
cookie = "0.18"
sha2 = "0.10"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", features = ["tray-icon"] }
self-replace = "1"
semver = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
