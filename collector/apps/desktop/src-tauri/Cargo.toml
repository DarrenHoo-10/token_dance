[workspace]

[package]
name = "tokendance-desktop"
version = "0.1.0"
edition = "2021"
authors = ["TokenDance Team"]
description = "TokenDance Desktop Collector Settings Shell"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full", "sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tauri = { version = "2", features = ["tray-icon"] }

[build-dependencies]
tauri-build = "2"
