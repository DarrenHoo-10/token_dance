<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>TokenDance · 悬浮球视觉验收</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:40px;font:14px 'Segoe UI','Microsoft YaHei',sans-serif;color:#17241c;background:#f5f6f3}h1{margin:0;font-size:28px}p{color:#737c76;margin:10px 0 24px}.hero{display:flex;align-items:center;gap:50px;margin-bottom:20px}.orb{position:relative;flex:none;width:calc(var(--s) + 32px);height:calc(var(--s) + 32px)}iframe{border:0;position:absolute;background:transparent;width:100%;height:100%;inset:0;pointer-events:none}iframe.ball{inset:16px;width:var(--s);height:var(--s)}.samples{display:flex;gap:14px;flex-wrap:wrap}.sample{text-align:center}.sample p{margin:8px 0 20px}.dark{background:#15201e;color:#eef3ee;padding:24px;border-radius:16px;margin-top:24px}.dark p{color:#abbab2}h2{font-size:16px;font-weight:500}button{padding:8px 16px;cursor:pointer}
</style>
<h1>TokenDance · 悬浮球</h1><p>真实组件预览 · 玻璃高光 / 独立额度环 / 环绕微光</p>
<div class="hero" id="hero"></div><div class="samples" id="samples"></div><div class="dark"><h2>深色背景 / 长数字 / 额度待更新</h2><div class="samples" id="dark"></div></div>
<script>
function orb(parent,remaining,size=112,tokens='5100000',state='fresh',label=''){
 const sample=document.createElement('div');sample.className='sample';
 const host=document.createElement('div');host.className='orb';host.style.setProperty('--s',size+'px');
 for(const view of ['orb-effects','orb']){const frame=document.createElement('iframe');frame.title=view+' '+remaining+'%';frame.className=view==='orb'?'ball':'effects';frame.src=`/?view=${view}&previewRemaining=${remaining}&previewTokens=${tokens}&previewState=${state}`;host.append(frame)}
 sample.append(host);const caption=document.createElement('p');caption.textContent=label||remaining+'%';sample.append(caption);parent.append(sample);
}
orb(document.querySelector('#hero'),72,240,'5100000','fresh','放大细节');orb(document.querySelector('#hero'),72,112,'5100000','fresh','默认 112 px');orb(document.querySelector('#hero'),88,160,'291830000','fresh','291.83M · 160 px');
for(const percent of [100,80,60,40,25,10,0])orb(document.querySelector('#samples'),percent);
orb(document.querySelector('#dark'),88,112,'291830000','fresh','291.83M · 112 px');orb(document.querySelector('#dark'),40,144,'999990000','fresh','999.99M · 144 px');orb(document.querySelector('#dark'),72,112,'5100000','stale','额度待更新');
</script></html>
