openapi: 3.0.3
info:
  title: TokenDance User & Device API
  version: 1.0.0
  description: Official OpenAPI contract for TokenDance User System, Personal Analytics, Public Profiles, and Collector Device
    Management.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://api.tokendance.com
  description: Production API server
- url: https://api.staging.tokendance.com
  description: Staging API server
tags:
- name: System
  description: System liveness and readiness probes
- name: Auth
  description: User authentication, registration, session management, and password recovery
- name: Profile
  description: User profile and onboarding
- name: Privacy
  description: User privacy settings and account deletion
- name: Analytics
  description: Personal analytics, token trends, breakdowns, and skill metrics
- name: Devices
  description: Collector device management and pairing
- name: Exports
  description: Privacy-safe data exports
- name: Public
  description: Public community profiles, leaderboard rankings, search, and comparison
- name: Collector
  description: Collector agent pairing and ingestion endpoints
paths:
  /healthz:
    get:
      tags:
      - System
      operationId: healthz
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /readyz:
    get:
      tags:
      - System
      operationId: readyz
      summary: Readiness check
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/register/code:
    post:
      tags:
      - Auth
      operationId: requestRegisterCode
      summary: Request registration verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                locale:
                  type: string
                  enum:
                  - zh-CN
                  - en-US
                  default: en-US
      responses:
        '202':
          description: Verification code requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: pending
                  cooldownSeconds:
                    type: integer
                    example: 60
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      operationId: register
      summary: Complete email registration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - code
              - password
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  example: '123456'
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                returnTo:
                  type: string
                locale:
                  type: string
                  enum: [zh-CN, en-US]
                  description: Preferred UI locale applied as the account default.
                timezone:
                  type: string
                  description: IANA timezone applied as the account default; invalid values fall back to UTC.
                  example: Asia/Shanghai
      responses:
        '201':
          description: Registration completed and session created
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/SessionUser'
                  csrfToken:
                    type: string
                  returnTo:
                    type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                returnTo:
                  type: string
                deviceLabel:
                  type: string
                keepSignedIn:
                  type: boolean
                  default: true
                  description: When true (default), the machine keeps the session cookie for 30 days.
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/SessionUser'
                  csrfToken:
                    type: string
                  returnTo:
                    type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/session:
    get:
      tags:
      - Auth
      operationId: getSession
      summary: Get current authenticated session
      security:
      - CookieAuth: []
      responses:
        '200':
          description: Active session
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/SessionUser'
                  csrfToken:
                    type: string
                  idleExpiresAt:
                    type: string
                    format: date-time
                  absoluteExpiresAt:
                    type: string
                    format: date-time
        '204':
          description: No active session
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: Logout current session
      security:
      - CookieAuth: []
      responses:
        '204':
          description: Logged out successfully
        '401':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
  /api/v1/auth/sessions:
    get:
      tags:
      - Auth
      operationId: listSessions
      summary: List user active sessions
      security:
      - CookieAuth: []
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionItem'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/sessions/{id}:
    delete:
      tags:
      - Auth
      operationId: revokeSession
      summary: Revoke a specific session
      security:
      - CookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session revoked
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/sessions/revoke-others:
    post:
      tags:
      - Auth
      operationId: revokeOtherSessions
      summary: Revoke all other active sessions
      security:
      - CookieAuth: []
      responses:
        '204':
          description: Other sessions revoked
        '401':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
  /api/v1/auth/password/code:
    post:
      tags:
      - Auth
      operationId: requestPasswordResetCode
      summary: Request password reset code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Reset code requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: pending
                  cooldownSeconds:
                    type: integer
                    example: 60
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/password/reset:
    post:
      tags:
      - Auth
      operationId: resetPassword
      summary: Reset password with code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - code
              - newPassword
              properties:
                email:
                  type: string
                code:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '204':
          description: Password reset successfully
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/me/onboarding:
    post:
      tags:
      - Profile
      operationId: completeOnboarding
      summary: Complete user onboarding
      security:
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - displayName
              - handle
              properties:
                displayName:
                  type: string
                handle:
                  type: string
                timezone:
                  type: string
                  default: UTC
                locale:
                  type: string
                  enum:
                  - zh-CN
                  - en-US
                privacy:
                  $ref: '#/components/schemas/OnboardingPrivacyRequest'
                returnTo:
                  type: string
      responses:
        '200':
          description: Onboarding completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
                  privacy:
                    $ref: '#/components/schemas/PrivacySettings'
                  returnTo:
                    type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
  /api/v1/me/profile:
    get:
      tags:
      - Profile
      operationId: getProfile
      summary: Get current user profile
      security:
      - CookieAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags:
      - Profile
      operationId: updateProfile
      summary: Update user profile
      security:
      - CookieAuth: []
      parameters:
      - name: If-Match
        in: header
        schema:
          type: string
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                handle:
                  type: string
                bio:
                  type: string
                timezone:
                  type: string
                locale:
                  type: string
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '412':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/me/privacy:
    get:
      tags:
      - Privacy
      operationId: getPrivacy
      summary: Get user privacy settings
      security:
      - CookieAuth: []
      responses:
        '200':
          description: Privacy settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettings'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags:
      - Privacy
      operationId: updatePrivacy
      summary: Update user privacy settings
      security:
      - CookieAuth: []
      parameters:
      - name: If-Match
        in: header
        schema:
          type: string
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePrivacyRequest'
      responses:
        '200':
          description: Privacy settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettings'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '412':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/me/public-preview:
    get:
      tags:
      - Privacy
      operationId: getPublicPreview
      summary: Preview own public profile
      security:
      - CookieAuth: []
      responses:
        '200':
          description: Public profile preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserProfile'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/me/avatar-upload-intents:
    post:
      tags:
      - Profile
      operationId: createAvatarUploadIntent
      summary: Create avatar upload intent
      security:
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contentType
              - byteSize
              - sha256
              properties:
                contentType:
                  type: string
                  enum:
                  - image/png
                  - image/jpeg
                  - image/webp
                byteSize:
                  type: integer
                sha256:
                  type: string
      responses:
        '201':
          description: Upload intent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  objectId:
                    type: string
                  uploadUrl:
                    type: string
                  expiresAt:
                    type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
  /api/v1/me/avatar-upload-intents/{id}/complete:
    post:
      tags:
      - Profile
      operationId: completeAvatarUpload
      summary: Mark avatar upload intent complete
      security:
      - CookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Avatar upload processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/me/avatar:
    delete:
      tags:
      - Profile
      operationId: deleteAvatar
      summary: Clear current avatar
      security:
      - CookieAuth: []
      responses:
        '204':
          description: Avatar cleared
        '401':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
  /api/v1/me/summary:
    get:
      tags:
      - Analytics
      operationId: getPersonalSummary
      summary: Get personal analytics summary (10 core metrics)
      security:
      - CookieAuth: []
      parameters:
      - name: range
        in: query
        schema:
          type: string
          enum:
          - today
          - 7d
          - 30d
          - all
          - custom
          default: 30d
      - name: from
        in: query
        description: Used when range=custom; interpreted in the user timezone.
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Used when range=custom; interpreted in the user timezone.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Personal summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalSummary'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/me/trends/tokens:
    get:
      tags:
      - Analytics
      operationId: getTokenTrends
      summary: Get token trends over time
      security:
      - CookieAuth: []
      parameters:
      - name: range
        in: query
        schema:
          type: string
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - total
          - structure
      - name: agent
        in: query
        schema:
          type: string
      - name: provider
        in: query
        schema:
          type: string
      - name: model
        in: query
        schema:
          type: string
      - name: from
        in: query
        description: Used when range=custom; interpreted in the user timezone.
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Used when range=custom; interpreted in the user timezone.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Token trends response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/me/breakdowns/agents:
    get:
      tags:
      - Analytics
      operationId: getAgentBreakdown
      summary: Get agent usage breakdown
      security:
      - CookieAuth: []
      parameters:
      - name: range
        in: query
        schema:
          type: string
      - name: from
        in: query
        description: Used when range=custom; interpreted in the user timezone.
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Used when range=custom; interpreted in the user timezone.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Agent breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/me/breakdowns/models:
    get:
      tags:
      - Analytics
      operationId: getModelBreakdown
      summary: Get model usage breakdown
      security:
      - CookieAuth: []
      parameters:
      - name: range
        in: query
        schema:
          type: string
      - name: from
        in: query
        description: Used when range=custom; interpreted in the user timezone.
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Used when range=custom; interpreted in the user timezone.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Model breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/me/skills:
    get:
      tags:
      - Analytics
      operationId: getPersonalSkills
      summary: Get personal skill rankings
      security:
      - CookieAuth: []
      parameters:
      - name: range
        in: query
        schema:
          type: string
      - name: from
        in: query
        description: Used when range=custom; interpreted in the user timezone.
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Used when range=custom; interpreted in the user timezone.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Skill rankings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillsResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/me/calendar:
    get:
      tags:
      - Analytics
      operationId: getActivityCalendar
      summary: Get activity calendar
      security:
      - CookieAuth: []
      parameters:
      - name: range
        in: query
        schema:
          type: string
      - name: from
        in: query
        description: Used when range=custom; interpreted in the user timezone.
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Used when range=custom; interpreted in the user timezone.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Activity calendar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/me/activity:
    get:
      tags:
      - Analytics
      operationId: getActivity
      summary: Get safe activity log (P1)
      security:
      - CookieAuth: []
      parameters:
      - name: range
        in: query
        schema:
          type: string
          enum:
          - today
          - 7d
          - 30d
          - all
          - custom
          default: 30d
      - name: from
        in: query
        description: Required for custom range; interpreted in the user timezone.
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Required for custom range; interpreted in the user timezone.
        schema:
          type: string
          format: date
      - name: agent
        in: query
        schema:
          type: string
      - name: provider
        in: query
        schema:
          type: string
      - name: model
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Activity items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/me/filter-options:
    get:
      tags:
      - Analytics
      operationId: getFilterOptions
      summary: Get available filter options for user
      security:
      - CookieAuth: []
      responses:
        '200':
          description: Filter options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterOptions'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/me/devices:
    get:
      tags:
      - Devices
      operationId: listDevices
      summary: List user registered devices
      security:
      - CookieAuth: []
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceItem'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/me/device-bindings:
    post:
      tags:
      - Devices
      operationId: createDeviceBinding
      summary: Create 8-character Crockford Base32 device binding challenge
      security:
      - CookieAuth: []
      responses:
        '201':
          description: Binding code created
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeId:
                    type: string
                  code:
                    type: string
                    example: 7K9M2P4X
                  expiresAt:
                    type: string
        '401':
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
  /api/v1/me/device-bindings/{id}:
    delete:
      tags:
      - Devices
      operationId: cancelDeviceBinding
      summary: Cancel binding code
      security:
      - CookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Binding code cancelled
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/me/devices/{id}:
    patch:
      tags:
      - Devices
      operationId: updateDevice
      summary: Rename device
      security:
      - CookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - deviceName
              properties:
                deviceName:
                  type: string
      responses:
        '200':
          description: Device renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceItem'
        '400':
