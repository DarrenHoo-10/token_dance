  /v1/telemetry/batches:
    post:
      tags:
      - Collector
      operationId: ingestTelemetryBatch
      summary: Ingest an Ed25519-signed telemetry batch
      description: 'The collector signs the following UTF-8 canonical request using its registered Ed25519 private key:

        `UPPERCASE_METHOD + "\\n" + ESCAPED_PATH + "\\n" + X-Timestamp + "\\n" + X-Nonce + "\\n" + lowercase(X-Body-SHA256)`.

        `X-Body-SHA256` is the lowercase hexadecimal SHA-256 of the transmitted bytes, including gzip encoding when used.

        The signature is unpadded base64url in `Authorization: Device <installation-id>:<signature>`.

        Timestamps must be RFC3339 and within five minutes of server time. Nonces are single-use per installation.

        `Idempotency-Key` is the batch id; replaying the same batch id with an identical transmitted body returns the original
        ACK,

        while reusing it with a different body returns `INGEST_BATCH_HASH_CONFLICT`.

        '
      security:
      - DeviceAuth: []
      parameters:
      - name: X-Timestamp
        in: header
        required: true
        description: RFC3339 request creation time used verbatim in the canonical signature.
        schema:
          type: string
          format: date-time
      - name: X-Nonce
        in: header
        required: true
        description: Single-use opaque nonce containing 16 to 128 characters.
        schema:
          type: string
          minLength: 16
          maxLength: 128
      - name: X-Body-SHA256
        in: header
        required: true
        description: Lowercase hexadecimal SHA-256 of the transmitted request body bytes.
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      - name: Idempotency-Key
        in: header
        required: true
        description: Batch identifier, matching batchId when that body field is present.
        schema:
          type: string
          maxLength: 30
          pattern: ^bat_[A-Za-z0-9_-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryBatch'
      responses:
        '200':
          description: Batch committed or an identical prior batch ACK replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryBatchAck'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/me/device-grants:
    post:
      tags:
