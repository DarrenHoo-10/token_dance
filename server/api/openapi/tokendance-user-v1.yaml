    TelemetryEvent:
      type: object
      additionalProperties: false
      required:
      - eventId
      - schemaVersion
      - adapterId
      - adapterVersion
      - agentId
      - eventType
      - accuracy
      - sourceKind
      - occurredAt
      - privacyPolicyVersion
      properties:
        eventId: &id001
          type: string
          description: 32-byte hex or unpadded base64url privacy-safe hash.
        schemaVersion:
          type: integer
          minimum: 1
        adapterId:
          type: string
          maxLength: 64
          pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
        adapterVersion:
          type: string
          maxLength: 32
          pattern: '^[0-9]+(?:\.[0-9]+){0,3}(?:-[a-z0-9]+(?:[.-][a-z0-9]+)*)?$'
        agentId:
          type: string
          maxLength: 64
          pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
        agentVersion:
          type: string
          maxLength: 32
          pattern: '^[0-9]+(?:\.[0-9]+){0,3}(?:-[a-z0-9]+(?:[.-][a-z0-9]+)*)?$'
        providerId:
          type: string
          maxLength: 64
          pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
        modelId:
          type: string
          maxLength: 128
          pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
        eventType:
          type: string
          enum:
          - session_started
          - session_ended
          - turn_started
          - turn_completed
          - model_usage_recorded
          - tool_invoked
          - skill_invoked
          - code_changed
          - cost_recorded
          - agent_spawned
        accuracy:
          type: string
          enum:
          - exact
          - derived
          - estimated
          - correlated
        sourceKind:
          type: string
          enum:
          - otlp
          - jsonl
          - sqlite_snapshot
          - file_snapshot
          - runtime_stream
          - local_http_api
          - command_snapshot
          - remote_api
        occurredAt:
          type: string
          format: date-time
        sessionHash: *id001
        parentSessionHash: *id001
        turnHash: *id001
        toolCallHash: *id001
        tokenInput:
          type: integer
          minimum: 0
        tokenOutput:
          type: integer
          minimum: 0
        tokenCacheRead:
          type: integer
          minimum: 0
        tokenCacheWrite:
          type: integer
          minimum: 0
        tokenReasoning:
          type: integer
          minimum: 0
        tokenTotal:
          type: integer
          minimum: 0
        durationMs:
          type: integer
          minimum: 0
        success:
          type: boolean
        toolCategory:
          type: string
          maxLength: 64
          pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
        skillKey: *id001
        skillPublicName:
          type: string
          maxLength: 120
          pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
        skillInvokeType:
          type: string
          enum:
          - native
          - hook
          - tool_correlated
          - runtime_correlated
          - explicit
          - implicit
          - automatic
          - unknown
        pluginKey: *id001
        codeGeneratedLines:
          type: integer
          minimum: 0
        codeAcceptedLines:
          type: integer
          minimum: 0
        codeAddedLines:
          type: integer
          minimum: 0
        codeDeletedLines:
          type: integer
          minimum: 0
        codeFileCount:
          type: integer
          minimum: 0
        costAmount:
          type: string
          maxLength: 29
          pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]{1,8})?$'
        costCurrency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
        costSource:
          type: string
          enum:
          - provider_reported
          - estimated_price_table
        privacyPolicyVersion:
          type: integer
          minimum: 1
        metadata:
          type: object
          description: >-
            Optional privacy-safe scalar extensions. At most 8 fields are accepted, keys are limited to 32 bytes,
            and every string is restricted to the enum or normalized identifier pattern declared for that field.
            Keys are registered per event type: session_started (sessionMode, trigger), session_ended (endReason),
            turn_started (trigger), turn_completed (finishReason), model_usage_recorded (finishReason, serviceTier),
            tool_invoked (operation, success), skill_invoked (invocationSource), code_changed (language),
            cost_recorded (billingCategory, estimated), and agent_spawned (spawnReason). Unknown keys, non-scalar
            values, arbitrary text, and prompt, response, reasoning, code body, tool argument, environment, real path,
            credential, secret, or API-key content are rejected per event.
          maxProperties: 8
          properties:
            sessionMode:
              type: string
              enum:
              - interactive
              - batch
              - background
              - daemon
              - unknown
            trigger:
              type: string
              enum:
              - user
              - system
              - automation
              - resume
              - unknown
            endReason:
              type: string
              enum:
              - completed
              - cancelled
              - error
              - timeout
              - shutdown
              - unknown
            finishReason:
              type: string
              enum:
              - stop
              - length
              - tool_call
              - content_filter
              - error
              - cancelled
              - unknown
            serviceTier:
              type: string
              enum:
              - default
              - standard
              - priority
              - flex
              - scale
              - unknown
            operation:
              type: string
              maxLength: 128
              pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
            success:
              type: boolean
            invocationSource:
              type: string
              enum:
              - user
              - model
              - system
              - automation
              - unknown
            language:
              type: string
              maxLength: 128
              pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
            billingCategory:
              type: string
              enum:
              - token_usage
              - tool_usage
              - subscription
              - credit
              - other
            estimated:
              type: boolean
            spawnReason:
              type: string
              enum:
              - user_request
              - delegation
              - parallelism
              - retry
              - specialization
              - unknown
          additionalProperties: false
    TelemetryBatch:
      type: object
      additionalProperties: false
      required:
      - batchId
      - events
      properties:
        batchId:
          type: string
          maxLength: 30
          pattern: ^bat_[A-Za-z0-9_-]+$
