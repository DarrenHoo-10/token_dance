      parameters:
      - $ref: '#/components/parameters/CSRFToken'
  /v1/telemetry/ingest:
    $ref: '#/paths/~1v1~1telemetry~1batches'
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: __Host-tokendance_session
    BearerAuth:
      type: http
      scheme: bearer
    DeviceAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Device installation id and unpadded base64url Ed25519 signature in `Device <installation-id>:<signature>`
        format.
  responses:
    ErrorResponse:
      description: Standard API Error
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                type: object
                required:
                - code
                - messageKey
                - requestId
                properties:
                  code:
                    type: string
                  messageKey:
                    type: string
                  requestId:
                    type: string
                  details:
                    type: object
  schemas:
    SessionUser:
      type: object
      required:
      - userId
      - displayName
      - onboardingRequired
      - productState
      properties:
        userId:
          type: string
        handle:
          type: string
          nullable: true
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        locale:
          type: string
        onboardingRequired:
          type: boolean
        productState:
          type: string
          enum:
          - email_unverified
          - new
          - active_private
          - active_public
          - suspended
          - deletion_pending
          - deleted
    SessionItem:
      type: object
      required:
      - sessionId
      - sessionStatus
      - lastSeenAt
      - createdAt
      - absoluteExpiresAt
      properties:
        sessionId:
          type: string
        deviceLabel:
          type: string
          nullable: true
        sessionStatus:
          type: string
        lastSeenAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
    UserProfile:
      type: object
      required:
      - userId
      - displayName
      - accountStatus
      - leaderboardVisibility
      - profileVersion
      properties:
        userId:
          type: string
        handle:
          type: string
          nullable: true
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        timezoneName:
          type: string
        locale:
          type: string
        accountStatus:
          type: string
        leaderboardVisibility:
          type: string
        profileVersion:
          type: integer
    PrivacySettings:
      type: object
