          - private
          - public
        showBio:
          type: boolean
        showTokenTotal:
          type: boolean
        showTrends:
          type: boolean
        showActivityCalendar:
          type: boolean
        showAgentBreakdown:
          type: boolean
        showSkillRanking:
          type: boolean
