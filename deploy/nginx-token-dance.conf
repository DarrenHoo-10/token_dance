# Include inside the existing HTTPS server block for www.nexorai.com.cn.
location = /token-dance {
    return 308 /token-dance/;
}

location ^~ /token-dance/api/ {
    proxy_pass http://127.0.0.1:8130/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 8m;
    add_header Cache-Control "no-store" always;
}

location ^~ /token-dance/v1/ {
    proxy_pass http://127.0.0.1:8130/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 8m;
    add_header Cache-Control "no-store" always;
}

location = /token-dance/healthz {
    proxy_pass http://127.0.0.1:8130/healthz;
}

location = /token-dance/readyz {
    proxy_pass http://127.0.0.1:8130/readyz;
}

# Publisher updates this independently of application deployments. Do not serve
# the SPA HTML or a stale manifest when the release file is missing.
location = /token-dance/releases/stable.json {
    alias /var/www/token-dance-releases/stable.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /token-dance/assets/ {
    root /var/www;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /token-dance/ {
    root /var/www;
    try_files $uri $uri/ /token-dance/index.html;
    add_header Cache-Control "no-cache";
}
